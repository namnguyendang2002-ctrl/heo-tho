let AC,G,M,mood='warm',bar=0,nt=0,mute=0;
const fq=m=>440*2**((m-69)/12),PR={warm:[[48,52,55],[43,47,50],[45,48,52],[41,45,48]],sad:[[45,48,52],[41,45,48],[48,52,55],[43,47,50]],tense:[[45,48,52],[44,47,50],[45,48,52],[44,47,51]]};
function nn(m,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=fq(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(G);o.start(t);o.stop(t+d+.05)}
function sched(){while(nt<AC.currentTime+1.5){const c=PR[mood][bar++%4];if(nt<AC.currentTime)nt=AC.currentTime+.05;
 if(mood=='warm'){const e=.2;[0,4].forEach(j=>nn(c[0]-24,nt+j*e,e*3,'triangle',.11));[2,3,6,7].forEach(j=>[1,2].forEach(k=>nn(c[k],nt+j*e,e*1.1,'triangle',.035)));
  [[0,2],[1,1],[2,2],[3,0],[4,1],[5,2],[6,1],[7,0]].forEach(([j,k])=>nn(c[k]+24,nt+j*e,e*1.5,'sine',.07));nn(c[2]+36,nt+3.5*e,e,'sine',.03);nt+=8*e}
 else{const sp=mood=='sad'?.62:.35;c.forEach(m=>nn(m-12,nt,sp*8,'sine',.06));[0,1,2,1,2,1,0,1].forEach((k,j)=>nn(c[k]+12,nt+j*sp,sp*2.2,'triangle',.07));nn(c[2]+24,nt+4*sp,sp*3,'sine',.04);nt+=8*sp}}}
function startMusic(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();M=AC.createGain();M.gain.value=.5;M.connect(AC.destination);G=AC.createGain();G.gain.value=1;G.connect(M);nt=AC.currentTime;sched();setInterval(sched,500)}
$('mu').onclick=e=>{e.stopPropagation();mute=!mute;if(M)M.gain.value=mute?0:.55;$('mu').textContent=mute?'🔇':'🔊'};

$('intro').onclick=()=>{try{startMusic()}catch(_){}$('intro').remove();card.innerHTML='<small>Heo &amp; Thỏ</small><b>Một bộ phim ngắn về chúng mình</b><u></u>';card.className='show';setTimeout(()=>{card.className='';scene()},2600)};
